<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | SAMARA</title>
  <!-- External CSS -->
  <link rel="stylesheet" href="css/contact.css" />
  <!-- FontAwesome -->
  <script src="https://kit.fontawesome.com/aa9a0b170b.js" crossorigin="anonymous"></script>
  <!-- AOS CSS -->
  <!-- <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" /> -->
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
     <div class="falling-leaves"></div>


  <!-- Navbar -->
  <nav class="navbar fade-down" data-aos="fade-down" data-aos-duration="800">
    <div class="content">
      <div class="logo">
        <div class="logo-icon">
          <img class="img-icon" src="img/icon-logo.png" alt="Logo Samara">
        </div>
        <div class="logo-title">
          <a class="title-icon" href="#">SAMARA</a>
        </div>
      </div>
      <ul class="menu-list">
        <div class="icon cancel-btn">
          <i class="fa-solid fa-times"></i>
        </div>
        <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="about.html"><i class="fa-solid fa-user"></i> About</a></li>
        <li><a href="blog.html"><i class="fa-solid fa-blog"></i> Blog</a></li>
        <li><a href="contact.html"><i class="fa-solid fa-envelope"></i> Contact</a></li>
      </ul>
      <div class="icon menu-btn">
        <i class="fa-solid fa-bars"></i>
      </div>
    </div>
  </nav>

  <!-- Breadcrumb -->
  <div class="penanda fade-left" data-aos="fade-down">
    <p>Home / Contact</p>
  </div>

  <!-- Contact Section -->
  <section id="contact-2">
    <div class="container">
      <div class="contact-wrapper">
        <!-- Info Boxes -->
        <div class="info-boxes">
          <div class="info-item fade-up" data-aos="fade-up">
            <div class="icon-circle">
              <i class="fas fa-map-marker-alt"></i>
            </div>
            <h3>Alamat Kantor</h3>
            <p>Jalan Merdeka No. 45, Lhokseumawe, Aceh<br>(Dekat Politeknik Negeri Lhokseumawe)</p>
          </div>
          <div class="info-item fade-up" data-aos="fade-up" data-aos-delay="200">
            <div class="icon-circle">
              <i class="fas fa-phone"></i>
            </div>
            <h3>Telepon</h3>
            <p>+62 821 6543 2100</p>
          </div>
          <div class="info-item fade-up" data-aos="fade-up" data-aos-delay="400">
            <div class="icon-circle">
              <i class="fas fa-envelope"></i>
            </div>
            <h3>Email</h3>
            <p>info@samara.id</p>
          </div>
        </div>

        <!-- Map & Form -->
        <div class="contact-content">
          <!-- Map -->
          <div class="map fade-up" data-aos="fade-up">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15942.225679680613!2d97.1301352!3d5.1858058!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x304777687d8b3c71%3A0x8b565eab0ecf7f30!2sPoliteknik%20Negeri%20Lhokseumawe!5e0!3m2!1sid!2sid!4v1684321058961!5m2!1sid!2sid"
              frameborder="0"
              allowfullscreen=""
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>

          <!-- Contact Form -->
          <div class="contact-form fade-up" data-aos="fade-up">
            <form action="https://formspree.io/f/xnndreyd" method="POST">
              <div class="form-row">
                <input type="text" name="name" placeholder="Nama Anda" required>
                <input type="email" name="email" placeholder="Email Anda" required>
              </div>
              <input type="text" name="subject" placeholder="Subjek" required>
              <textarea name="message" rows="6" placeholder="Pesan" required></textarea>
              <button type="submit">Kirim Pesan</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer-bottom" data-aos="fade-up">
    <p>&copy; 2025 SAMARA. All rights reserved.</p>
  </footer>

  <!-- AOS JS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
  <script src="script.js"></script>
</body>
</html>
